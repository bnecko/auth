# Publishes @bottleneck/auth-sdk to npm when a version bump lands on master.
# Uses npm trusted publishing (OIDC) with provenance: no NPM_TOKEN secret; the
# package has this repository + workflow configured as a trusted publisher on
# npmjs.com. A push that leaves the version at the already-published value is
# a no-op, so docs-only SDK changes never release. A successful publish also
# pushes a sdk-node-v<version> tag for traceability.
name: sdk-release

on:
  push:
    branches:
      - master
    paths:
      - "sdk/node/**"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+; the built artifact still
          # targets node18 per tsup.config.ts.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: Skip when the version is already on the registry
        id: gate
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "@bottleneck/auth-sdk@${version}" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "version ${version} is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      - if: steps.gate.outputs.publish == 'true'
        run: npm run test:pack
      # prepublishOnly runs typecheck and the test suite; prepack builds.
      - if: steps.gate.outputs.publish == 'true'
        run: npm publish
      - name: Tag the release
        if: steps.gate.outputs.publish == 'true'
        run: |
          git tag "sdk-node-v${{ steps.gate.outputs.version }}"
          git push origin "sdk-node-v${{ steps.gate.outputs.version }}"
