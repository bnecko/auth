# Publishes @bottleneck/auth-sdk to npm when an sdk-node-v* tag is pushed.
# Uses npm trusted publishing (OIDC) with provenance: no NPM_TOKEN secret,
# but the package must have this repository + workflow configured as a
# trusted publisher on npmjs.com first.
name: sdk-release

on:
  push:
    tags:
      - "sdk-node-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+; the built artifact still
          # targets node18 per tsup.config.ts.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "sdk-node-v${version}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          }
      - run: npm ci
      - run: npm run test:pack
      # prepublishOnly runs typecheck and the test suite; prepack builds.
      - run: npm publish
